name: Build & Patch APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Download URL of the original app.unique.one APK'
        required: true
        type: string

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download original APK
        run: |
          echo "Downloading APK from ${{ inputs.apk_url }}"
          curl -L -o input.apk "${{ inputs.apk_url }}"
          echo "APK size: $(stat -c%s input.apk) bytes"

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build patcher-runner (fat JAR)
        run: ./gradlew :patcher-runner:shadowJar --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Patch APK
        run: java -jar patcher-runner/build/libs/patcher-runner-all.jar input.apk output.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: app-unique-one-patched
          path: output.apk
          retention-days: 90
